<!DOCTYPE html>
<html>
<head>
    <title>Simple Chat App</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; max-width: 600px; margin: 0 auto; }
        .hidden { display: none; }
        .form-group { margin: 10px 0; }
        input, button { padding: 10px; margin: 5px; border: 1px solid #ddd; border-radius: 5px; }
        button { background: #007bff; color: white; cursor: pointer; }
        button:hover { background: #0056b3; }
        #messages { height: 400px; border: 1px solid #ccc; overflow-y: auto; padding: 10px; margin: 10px 0; background: #f9f9f9; }
        .message { margin: 8px 0; padding: 8px; border-radius: 10px; max-width: 80%; }
        .sent { background: #dcf8c6; margin-left: auto; text-align: right; }
        .received { background: #ffffff; border: 1px solid #e0e0e0; }
        .system { text-align: center; color: #666; font-style: italic; background: none; }
        .user-info { background: #e3f2fd; padding: 10px; border-radius: 5px; margin-bottom: 15px; }
    </style>
</head>
<body>

<!-- Login Form -->
<div id="loginDiv">
    <h2>🔐 Chat Login</h2>
    <div class="form-group">
        <input id="usernameInput" placeholder="Username (user1 hoặc user2)" value="user1" />
    </div>
    <div class="form-group">
        <input id="passwordInput" type="password" placeholder="Password" value="password123" />
    </div>
    <button onclick="login()">Đăng Nhập</button>
    <p id="loginMessage" style="color: red;"></p>

    <hr>
    <p><strong>Test nhanh:</strong></p>
    <p>• User 1: username=<code>user1</code>, password=<code>password123</code></p>
    <p>• User 2: username=<code>user2</code>, password=<code>password456</code></p>
    <p>• Mở 2 tab với file này để test chat 2 chiều</p>
</div>

<!-- Chat Interface -->
<div id="chatDiv" class="hidden">
    <div class="user-info">
        <h3>💬 Chat Interface</h3>
        <p><strong>Đang đăng nhập:</strong> <span id="currentUser"></span></p>
        <p><strong>Trạng thái:</strong> <span id="connectionStatus">Đang kết nối...</span></p>
    </div>

    <div id="messages"></div>

    <div style="display: flex; gap: 10px;">
        <input id="messageInput" placeholder="Nhập tin nhắn..." style="flex: 1;" />
        <button onclick="sendMessage()">Gửi</button>
        <button onclick="logout()" style="background: #dc3545;">Thoát</button>
    </div>
</div>

<script>
    let socket = null;
    let currentUser = null;

    // Check đã login chưa khi load trang
    window.onload = function() {
        const token = localStorage.getItem('jwtToken');
        const userData = localStorage.getItem('userData');

        if (token && userData) {
            try {
                currentUser = JSON.parse(userData);
                showChatInterface();
                connectSocket();
            } catch (e) {
                logout();
            }
        }
    };

    // Đăng nhập
    async function login() {
        const username = document.getElementById('usernameInput').value.trim();
        const password = document.getElementById('passwordInput').value.trim();

        if (!username || !password) {
            document.getElementById('loginMessage').textContent = 'Vui lòng nhập đầy đủ thông tin!';
            return;
        }

        try {
            // Gọi API login
            const response = await fetch('/api/auth/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });

            if (!response.ok) {
                throw new Error('Login failed');
            }

            const data = await response.json();

            // Lưu token và user info
            localStorage.setItem('jwtToken', data.token);
            localStorage.setItem('userData', JSON.stringify({
                id: data.userId,
                username: data.username
            }));

            currentUser = {
                id: data.userId,
                username: data.username
            };

            showChatInterface();
            connectSocket();

        } catch (error) {
            // Fallback: Mock login cho test (khi chưa có API)
            const mockUsers = {
                'user1': { id: 1, username: 'user1' },
                'user2': { id: 2, username: 'user2' }
            };

            if (mockUsers[username]) {
                currentUser = mockUsers[username];
                localStorage.setItem('jwtToken', 'mock-token-' + username);
                localStorage.setItem('userData', JSON.stringify(currentUser));
                showChatInterface();
                connectSocket();
            } else {
                document.getElementById('loginMessage').textContent = 'Đăng nhập thất bại! (Dùng user1/user2 để test)';
            }
        }
    }

    // Hiển thị giao diện chat
    function showChatInterface() {
        document.getElementById('loginDiv').classList.add('hidden');
        document.getElementById('chatDiv').classList.remove('hidden');
        document.getElementById('currentUser').textContent = `${currentUser.username} (ID: ${currentUser.id})`;
    }

    // Kết nối Socket.IO
    function connectSocket() {
        const token = localStorage.getItem('jwtToken');

        socket = io('http://localhost:8085', {
            auth: { token: token },
            query: {
                userId: currentUser.id,
                username: currentUser.username
            }
        });

        // Xử lý kết nối thành công
        socket.on('connect', () => {
            console.log('✅ Connected:', socket.id);
            document.getElementById('connectionStatus').innerHTML = '<span style="color: green;">✅ Đã kết nối</span>';
            socket.emit('join_private_chat', currentUser.id);
            addSystemMessage('Đã kết nối thành công!');
        });

        // Xử lý mất kết nối
        socket.on('disconnect', () => {
            document.getElementById('connectionStatus').innerHTML = '<span style="color: red;">❌ Mất kết nối</span>';
            addSystemMessage('Mất kết nối với server');
        });

        // Nhận tin nhắn từ user khác
        socket.on(`private_message_${currentUser.id}`, (message) => {
            console.log('📨 Received:', message);
            addMessage(message, 'received');
        });

        // Xác nhận tin nhắn đã gửi
        socket.on('message_sent', (message) => {
            console.log('✉️ Sent:', message);
            addMessage(message, 'sent');
        });

        // Lỗi authentication
        socket.on('auth_error', (error) => {
            alert('Lỗi xác thực: ' + error);
            logout();
        });
    }

    // Gửi tin nhắn
    function sendMessage() {
        const input = document.getElementById('messageInput');
        const content = input.value.trim();

        if (!content || !socket) {
            return;
        }

        // Xác định người nhận (đơn giản: user 1 gửi cho user 2 và ngược lại)
        const receiverId = currentUser.id === 1 ? 2 : 1;
        const receiverUsername = currentUser.id === 1 ? 'user2' : 'user1';

        const messageData = {
            receiverId: receiverId,
            content: content,
            receiverUsername: receiverUsername
        };

        socket.emit('send_private_message', messageData);
        input.value = '';
    }

    // Hiển thị tin nhắn
    function addMessage(message, type) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = `message ${type}`;

        const time = new Date(message.timestamp || new Date()).toLocaleTimeString();
        const sender = type === 'sent' ? 'Tôi' : message.senderUsername;

        div.innerHTML = `
        <strong>${sender}:</strong> ${message.content}
        <br><small style="opacity: 0.7;">${time}</small>
    `;

        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // Hiển thị tin nhắn hệ thống
    function addSystemMessage(text) {
        const container = document.getElementById('messages');
        const div = document.createElement('div');
        div.className = 'message system';
        div.textContent = text;
        container.appendChild(div);
        container.scrollTop = container.scrollHeight;
    }

    // Đăng xuất
    function logout() {
        localStorage.clear();
        if (socket) {
            socket.disconnect();
            socket = null;
        }
        currentUser = null;
        location.reload();
    }

    // Enter để gửi tin nhắn hoặc login
    document.addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            if (currentUser) {
                sendMessage();
            } else {
                login();
            }
        }
    });
</script>

</body>
</html>
